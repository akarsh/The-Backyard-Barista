name: Verify Application

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Build & Server Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Production Vite build
        run: npm run build

      - name: Verify build output and static journal JSON
        run: |
          test -f dist/index.html
          test -f dist/data/recipe-journal.json
          node -e "const j = JSON.parse(require('fs').readFileSync('public/data/recipe-journal.json','utf8')); if (typeof j.version !== 'number' || !Array.isArray(j.entries)) process.exit(1);"

      - name: Smoke test production server
        env:
          NODE_ENV: production
        run: |
          node server.ts &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          # 1. Verify SPA entry point serves 200 OK
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "GET / -> $HTTP_STATUS"
          test "$HTTP_STATUS" = "200"

          # 2. Verify API validation returns structured JSON (400) on empty chat payload
          CHAT_STATUS=$(curl -s -o /tmp/chat_resp.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/barista/chat \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "POST /api/barista/chat (empty) -> $CHAT_STATUS"
          cat /tmp/chat_resp.json
          test "$CHAT_STATUS" = "400"
          node -e "const d = JSON.parse(require('fs').readFileSync('/tmp/chat_resp.json','utf8')); if (!d.error) process.exit(1);"

          # 3. Verify missing GEMINI_API_KEY fails cleanly with JSON (500), never HTML
          CRAFT_STATUS=$(curl -s -o /tmp/craft_resp.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/barista/craft \
            -H "Content-Type: application/json" \
            -d '{"flavors":["Sweet"]}')
          echo "POST /api/barista/craft (no key) -> $CRAFT_STATUS"
          cat /tmp/craft_resp.json
          test "$CRAFT_STATUS" = "500"
          node -e "const d = JSON.parse(require('fs').readFileSync('/tmp/craft_resp.json','utf8')); if (!d.error) process.exit(1);"

  public-repo-hygiene:
    name: Public Repository Secret & Env Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure no .env secret files are committed
        run: |
          BAD_ENV=$(git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$' || true)
          if [ -n "$BAD_ENV" ]; then
            echo "Found committed .env files:"
            echo "$BAD_ENV"
            exit 1
          fi

      - name: Scan tracked files for hardcoded Google API keys
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}' -- . ':!package-lock.json'; then
            echo "Potential hardcoded API key detected in tracked files."
            exit 1
          fi
